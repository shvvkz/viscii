[package]
name = "viscii"
version = "0.1.2"
edition = "2024"
description = "A small Rust CLI that plays a video in your terminal using ASCII characters"
license = "MIT"
repository = "https://github.com/shvvkz/viscii"
readme = "README.md"
keywords = ["terminal", "video", "ascii", "ffmpeg"]
categories = ["command-line-utilities", "multimedia"]

exclude = [
    "etc/",
    "videos/"
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ffmpeg-next = "9.0.0"
image = "0.25.10"
