name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-crate:
    name: Publish crate
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            pkg-config \
            clang \
            libclang-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev

      - name: Verify FFmpeg installation
        run: |
          ffmpeg -version
          pkg-config --modversion libavutil
          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          NAME="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if crate version already exists
        id: crate
        shell: bash
        env:
          NAME: ${{ steps.metadata.outputs.name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          URL="https://crates.io/api/v1/crates/${NAME}/${VERSION}"

          STATUS="$(curl \
            --retry 3 \
            -sS \
            -o /tmp/crate-version.json \
            -w "%{http_code}" \
            -H "User-Agent: viscii GitHub Actions release workflow" \
            "$URL")"

          echo "crates.io status: ${STATUS}"

          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "crate ${NAME} ${VERSION} already exists"
          elif [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "crate ${NAME} ${VERSION} is not published"
          else
            echo "Unexpected response: HTTP ${STATUS}"
            cat /tmp/crate-version.json || true
            exit 1
          fi

      - name: Verify package
        if: steps.crate.outputs.exists == 'false'
        run: cargo publish --dry-run --locked

      - name: Publish crate
        if: steps.crate.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
